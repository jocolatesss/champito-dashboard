<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>House Champito Refeed Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --magenta:#C41172;
    --magenta-bright:#E5308F;
    --magenta-dim:#4A1234;
    --bg:#140911;
    --panel:#1F1019;
    --line:#3A1A2C;
    --text:#F6E9F0;
    --muted:#B08CA0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
    color:var(--text);background:var(--bg);
    background-image:radial-gradient(circle at 50% -10%,var(--magenta-dim) 0,transparent 55%);
    display:flex;flex-direction:column;align-items:center;
    padding:32px 20px 48px;
  }
  header{text-align:center;max-width:420px}
  header img{width:150px;height:150px;display:block;margin:0 auto 8px}
  h1{
    font-family:"Alfa Slab One","Rockwell","Georgia",serif;
    font-weight:400;font-size:1.9rem;line-height:1.15;color:var(--magenta-bright);
  }
  header p{margin-top:8px;color:var(--muted);font-size:.95rem;line-height:1.45}

  main{width:100%;max-width:420px;margin-top:24px}

  .weeks{margin-bottom:22px}
  .weeks .title{font-weight:800;font-size:.95rem;margin-bottom:8px}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .grid button{
    font:inherit;font-weight:800;font-size:.9rem;padding:10px 0;
    background:var(--panel);color:var(--muted);
    border:2px solid var(--line);border-radius:8px;cursor:pointer;
  }
  .grid button[aria-pressed=true]{background:var(--magenta);border-color:var(--magenta-bright);color:#fff}
  .grid button:focus-visible{outline:3px solid var(--magenta-bright);outline-offset:2px}

  .field{margin-bottom:18px}
  label{display:block;font-weight:800;font-size:.95rem;margin-bottom:6px}
  label span{color:var(--magenta-bright)}
  .input{position:relative}
  input[type=number]{
    width:100%;font:inherit;font-size:1.5rem;font-weight:800;
    padding:14px 62px 14px 16px;
    border:2px solid var(--magenta);border-radius:10px;
    color:var(--text);background:var(--panel);outline:none;
    -moz-appearance:textfield;
  }
  input::placeholder{color:#6E4A5E}
  input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  input:focus-visible{border-color:var(--magenta-bright);box-shadow:0 0 0 4px var(--magenta-dim)}
  input.bad{border-color:#FF5A6E}
  .unit{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-weight:700;color:var(--muted);font-size:.9rem}
  .err{color:#FF8A98;font-weight:700;font-size:.85rem;margin-top:6px;display:none}

  .result{
    margin-top:26px;background:var(--magenta);color:#fff;
    border-radius:14px;padding:22px 20px 20px;text-align:center;
    box-shadow:0 10px 36px rgba(229,48,143,.3);
  }
  .result .lead{font-weight:700;font-size:1rem}
  .result .num{
    font-family:"Alfa Slab One","Rockwell","Georgia",serif;
    font-size:3.6rem;line-height:1;margin:6px 0 4px;letter-spacing:.5px;
  }
  .result .per{font-weight:700;font-size:.95rem;opacity:.9}
  .result .note{margin-top:10px;font-size:.8rem;font-weight:700;opacity:.75}
  .result .empty{font-weight:700;padding:14px 0;opacity:.9}
  @media (prefers-reduced-motion:no-preference){
    .result .num{transition:transform .15s ease}
    .result.pop .num{transform:scale(1.04)}
  }
</style>
</head>

<main>

    <div class="title">Which week are you in?</div>
    <div class="grid" id="grid" role="group" aria-label="Select week"></div>
  </div>

  const fmt=n=>Math.round(n).toLocaleString('en-US');
  let week=1;

  for(let w=1;w<=15;w++){
    const b=document.createElement('button');
    b.type='button'; b.textContent='Wk '+w; b.dataset.w=w;
    b.setAttribute('aria-pressed',w===week);
    b.addEventListener('click',()=>{week=w; setLabels(); calc();});
    grid.appendChild(b);
  }
  function setLabels(){
    grid.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.w===week));
    document.getElementById('lblM').textContent='(Week '+(week+1)+')';
    document.getElementById('lblA').textContent='(Week '+week+')';
    document.getElementById('lblT').textContent='Week '+(week+1);
  }
  function calc(){
    const m=parseFloat(maint.value), a=parseFloat(avg.value);
    const hasM=maint.value!=='', hasA=avg.value!=='';
    maint.classList.toggle('bad',hasM&&!(m>0));
    avg.classList.toggle('bad',hasA&&!(a>0));
    err.style.display='none';
    if(!hasM||!hasA){ empty.hidden=false; filled.hidden=true; return; }
    if(!(m>0)||!(a>0)){
      empty.hidden=false; filled.hidden=true;
      err.textContent='Both values must be greater than 0.'; err.style.display='block'; return;
    }
    if(a>m){ err.textContent='Your weekly average is above maintenance. Double check the numbers.'; err.style.display='block'; }
    const raw=(2*m+5*a)/7, rounded=Math.round(raw/10)*10;
    target.textContent=fmt(rounded);
    document.getElementById('note').textContent='Rounded to the nearest 10 from '+fmt(raw)+' kcal';
    empty.hidden=true; filled.hidden=false;
    result.classList.add('pop'); setTimeout(()=>result.classList.remove('pop'),150);
  }
  maint.addEventListener('input',calc); avg.addEventListener('input',calc);
  setLabels();
</script>
</body>
</html>
